; Rachel's Frame — Waveshare ESP32-S3-Touch-LCD-4.3 digital picture frame
;
; Board: ESP32-S3-WROOM-1-N16R8  (16 MB QIO flash, 8 MB OPI PSRAM)
;
; Needs Arduino core 3.x: Arduino_GFX 1.6 includes esp32-hal-periman.h and
; esp_private/periph_ctrl.h unconditionally, and neither exists in core 2.x.
; The official platformio/espressif32 package still ships core 2.0.17 even at
; 7.0.1, so this uses the pioarduino fork — which is where core 3.x lives.

[env:rachels-frame]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; The stock devkitc-1 definition assumes 8 MB flash and no PSRAM, so the
; N16R8 module's real configuration has to be spelled out.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
	-DBOARD_HAS_PSRAM
	; The board's USB-C goes to the S3's native USB, so route Serial there.
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DCORE_DEBUG_LEVEL=2

lib_deps =
	moononournation/GFX Library for Arduino@^1.5.0
	bitbank2/JPEGDEC@^1.6.1
	ricmoo/QRCode@^0.0.1
